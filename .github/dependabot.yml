# Ward baseline, from templates/dependabot.yml in malinfossum/ward.
# Majors are never grouped, so each gets its own PR for me to read.
version: 2
updates:
  # Only GitHub's own actions are grouped and may auto-merge. Every other
  # action, Ward's own reference included, gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]

  - package-ecosystem: npm # package.json
    directory: /libraries/layout-audit
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # A bump here fails the pin test in tools/csharp-api.test.mjs (it ties the packages to
  # the README's sync line), so it can't auto-merge until I re-verify the recipe.
  - package-ecosystem: nuget
    directory: /scaffolds/csharp-api
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm # package.json: jsdom for the design system's behaviour tests
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
