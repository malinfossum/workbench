# Ward baseline, from templates/dependabot.yml in malinfossum/ward.
# Majors are never grouped, so each gets its own PR for me to read. A block waits
# 21 days before it proposes a major, so a broken x.0.0 is fixed by then.
# Dependabot can't tell a major apart for Actions, so that block keeps its
# default wait of 3 days for every update.
version: 2
updates:
  # GitHub's own actions are grouped and may auto-merge. Ward's two pins arrive
  # together and merge only when both move to a Ward release tag. Every other
  # action gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]
      ward:
        patterns:
          - "malinfossum/ward*"

  - package-ecosystem: npm # package.json
    directory: /libraries/layout-audit
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # A bump here fails the pin test in tools/csharp-api.test.mjs (it ties the packages to
  # the README's sync line), so it can't auto-merge until I re-verify the recipe.
  - package-ecosystem: nuget
    directory: /scaffolds/csharp-api
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm # package.json: jsdom for the design system's behaviour tests
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
