# Ward baseline, from templates/dependabot.yml in malinfossum/ward.
# Majors are never grouped, so each gets its own PR for me to read.
version: 2
updates:
  # Only GitHub's own actions are grouped and may auto-merge. Every other
  # action, Ward's own reference included, gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]

  - package-ecosystem: nuget # *.csproj
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.NET.*"
          - "System.*"
        update-types: [minor, patch]
      nuget-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.NET.*"
          - "System.*"
        update-types: [minor, patch]
    # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi below 3.0.0, so a 3.x
    # bump fails restore with NU1608. Recheck when Microsoft.AspNetCore.OpenApi moves to 11.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # Microsoft.EntityFrameworkCore.Sqlite 10.x ships the SQLitePCLRaw 2.1.x bundle, and the
      # 3.x bundle dropped this package for SourceGear.sqlite3. A 3.x bump would put a 3.x
      # native library under the 2.1.x provider. Recheck when EF Core moves its bundle to 3.x.
      - dependency-name: "SQLitePCLRaw.lib.e_sqlite3"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk # global.json
    directory: /
    schedule:
      interval: weekly
