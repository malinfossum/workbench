<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="Project description goes here." />
		<title>Project</title>

		<!-- No-flash theme init (design-system/theme/theme-init-snippet.html): must run
		     BEFORE stylesheets. Rule: stored key (if "light" or "dark") ?? prefers-color-scheme.
		     Nothing is stored until the user picks; an invalid stored value is removed. -->
		<script>
			(() => {
				var root = document.documentElement;
				var theme = null;
				var palette = null;
				try {
					theme = localStorage.getItem("theme");
					if (theme !== "light" && theme !== "dark") {
						if (theme !== null) localStorage.removeItem("theme");
						theme = null;
					}
					palette = localStorage.getItem("palette");
				} catch {}
				if (!theme) {
					theme = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
				}
				root.dataset.theme = theme;
				root.dataset.palette = palette || "default";
			})();
		</script>

		<!-- Design system foundation -->
		<link rel="stylesheet" href="/design-system/tokens/index.css" />
		<link rel="stylesheet" href="/design-system/base/reset.css" />
		<link rel="stylesheet" href="/design-system/base/base.css" />
		<link rel="stylesheet" href="/design-system/primitives/index.css" />
		<link rel="stylesheet" href="/design-system/components/index.css" />
		<link rel="stylesheet" href="/design-system/compositions/index.css" />
		<link rel="stylesheet" href="/design-system/utilities/index.css" />

		<!-- Project-specific styles -->
		<link rel="stylesheet" href="/src/styles/main.css" />
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<div id="app" class="container stack stack-lg">
			<!-- The view renders the wordmark and the preference pickers into #header
			     and everything else into #main. UI text lives in src/locales, not here;
			     the controller keeps <html lang>, <title> and data-theme in sync. -->
			<header id="header" class="topbar"></header>
			<main id="main" class="card stack"></main>
		</div>

		<!-- Picker behaviour (keyboard, focus, one open at a time) for every
		     details[data-picker]. The controller owns the stored preferences through
		     design-system/theme/preferences.js, so theme-toggle.js is not loaded.
		     type="module" so Vite bundles it into the production build. -->
		<script type="module" src="/design-system/components/picker.js"></script>

		<!-- Vite entry point -->
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
